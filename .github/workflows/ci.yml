name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt "deepagents>=0.7,<0.8"
      - name: Parçalama, ölçüt, ajan döngüsü ve Deep Agents testleri
        run: pytest -v
      - name: Not defterleri (01, 02)
        run: |
          pip install nbconvert ipykernel
          jupyter nbconvert --to notebook --execute --output-dir /tmp notebooks/01_parcalama.ipynb notebooks/02_getirme_degerlendirme.ipynb
